name: Sync upstream master

on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: sync-upstream-master
    cancel-in-progress: true

jobs:
    sync:
        if: github.repository == 'ifpj/RSSHub-fork'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Sync master with upstream (force)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: gh repo sync "$GITHUB_REPOSITORY" --branch master --force
